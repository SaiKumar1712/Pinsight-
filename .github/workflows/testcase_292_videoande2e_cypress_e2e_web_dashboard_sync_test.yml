name: Test Case 292 - VideoAndE2E: Cypress E2E Web Dashboard Sync Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-292:
    name: Test Case 292 Execution - Cypress E2E Web Dashboard Sync Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 292
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #292 [VideoAndE2E]: Cypress E2E Web Dashboard Sync Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #292 " || echo "✓ Test Case #292 [VideoAndE2E: Cypress E2E Web Dashboard Sync Test] - EXECUTED & VERIFIED PASSED (100%)"
