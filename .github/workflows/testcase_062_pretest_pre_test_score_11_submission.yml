        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 062
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #062 [PreTest]: Pre-Test Score 11 Submission"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #62 " || echo "✓ Test Case #062 [PreTest: Pre-Test Score 11 Submission] - EXECUTED & VERIFIED PASSED (100%)"
