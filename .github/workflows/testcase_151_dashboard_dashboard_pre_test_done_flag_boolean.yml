name: Test Case 151 - Dashboard: Dashboard Pre-Test Done Flag Boolean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-151:
    name: Test Case 151 Execution - Dashboard Pre-Test Done Flag Boolean
    runs-on: ubuntu-latest

    steps:
