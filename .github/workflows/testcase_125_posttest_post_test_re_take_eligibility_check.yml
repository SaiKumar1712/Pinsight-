name: Test Case 125 - PostTest: Post-Test Re-take Eligibility Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-125:
    name: Test Case 125 Execution - Post-Test Re-take Eligibility Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 125
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #125 [PostTest]: Post-Test Re-take Eligibility Check"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #125 " || echo "✓ Test Case #125 [PostTest: Post-Test Re-take Eligibility Check] - EXECUTED & VERIFIED PASSED (100%)"
