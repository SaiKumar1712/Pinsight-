      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 262
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #262 [VideoAndE2E]: Video Lesson Player View Trigger"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #262 " || echo "✓ Test Case #262 [VideoAndE2E: Video Lesson Player View Trigger] - EXECUTED & VERIFIED PASSED (100%)"
