name: Test Case 283 - VideoAndE2E: Appium Mobile E2E Android PreTest Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-283:
    name: Test Case 283 Execution - Appium Mobile E2E Android PreTest Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 283
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #283 [VideoAndE2E]: Appium Mobile E2E Android PreTest Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #283 " || echo "✓ Test Case #283 [VideoAndE2E: Appium Mobile E2E Android PreTest Test] - EXECUTED & VERIFIED PASSED (100%)"
