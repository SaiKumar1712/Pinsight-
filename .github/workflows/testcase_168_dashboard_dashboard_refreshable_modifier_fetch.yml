        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 168
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #168 [Dashboard]: Dashboard Refreshable Modifier Fetch"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #168 " || echo "✓ Test Case #168 [Dashboard: Dashboard Refreshable Modifier Fetch] - EXECUTED & VERIFIED PASSED (100%)"
