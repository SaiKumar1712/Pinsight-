      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 149
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #149 [PostTest]: Post-Test Growth Delta Negative"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #149 " || echo "✓ Test Case #149 [PostTest: Post-Test Growth Delta Negative] - EXECUTED & VERIFIED PASSED (100%)"
