name: Test Case 264 - VideoAndE2E: Video Module Title Header Display

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-264:
    name: Test Case 264 Execution - Video Module Title Header Display
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 264
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #264 [VideoAndE2E]: Video Module Title Header Display"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #264 " || echo "✓ Test Case #264 [VideoAndE2E: Video Module Title Header Display] - EXECUTED & VERIFIED PASSED (100%)"
