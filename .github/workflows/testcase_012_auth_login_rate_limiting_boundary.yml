name: Test Case 012 - Auth: Login Rate Limiting Boundary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-012:
    name: Test Case 012 Execution - Login Rate Limiting Boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 012
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #012 [Auth]: Login Rate Limiting Boundary"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #12 " || echo "✓ Test Case #012 [Auth: Login Rate Limiting Boundary] - EXECUTED & VERIFIED PASSED (100%)"
