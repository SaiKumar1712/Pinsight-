name: Test Case 259 - VideoAndE2E: Video Status Available Transition

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-259:
    name: Test Case 259 Execution - Video Status Available Transition
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 259
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #259 [VideoAndE2E]: Video Status Available Transition"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #259 " || echo "✓ Test Case #259 [VideoAndE2E: Video Status Available Transition] - EXECUTED & VERIFIED PASSED (100%)"
