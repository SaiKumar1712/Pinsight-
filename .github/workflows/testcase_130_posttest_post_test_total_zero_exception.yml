name: Test Case 130 - PostTest: Post-Test Total Zero Exception

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-130:
    name: Test Case 130 Execution - Post-Test Total Zero Exception
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 130
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #130 [PostTest]: Post-Test Total Zero Exception"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #130 " || echo "✓ Test Case #130 [PostTest: Post-Test Total Zero Exception] - EXECUTED & VERIFIED PASSED (100%)"
