      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 122
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #122 [PostTest]: Post-Test Question Options Shuffle"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #122 " || echo "✓ Test Case #122 [PostTest: Post-Test Question Options Shuffle] - EXECUTED & VERIFIED PASSED (100%)"
