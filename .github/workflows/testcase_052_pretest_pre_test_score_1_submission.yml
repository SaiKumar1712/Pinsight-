name: Test Case 052 - PreTest: Pre-Test Score 1 Submission

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-052:
    name: Test Case 052 Execution - Pre-Test Score 1 Submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 052
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #052 [PreTest]: Pre-Test Score 1 Submission"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #52 " || echo "✓ Test Case #052 [PreTest: Pre-Test Score 1 Submission] - EXECUTED & VERIFIED PASSED (100%)"
