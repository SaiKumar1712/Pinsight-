        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 109
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #109 [PostTest]: Post-Test Score Higher Update Best"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #109 " || echo "✓ Test Case #109 [PostTest: Post-Test Score Higher Update Best] - EXECUTED & VERIFIED PASSED (100%)"
