name: Test Case 202 - History: Attempt History Array Decode Assertion

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-202:
    name: Test Case 202 Execution - Attempt History Array Decode Assertion
    runs-on: ubuntu-latest

    steps:
