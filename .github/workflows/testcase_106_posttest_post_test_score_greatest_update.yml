        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 106
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #106 [PostTest]: Post-Test Score GREATEST Update"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #106 " || echo "✓ Test Case #106 [PostTest: Post-Test Score GREATEST Update] - EXECUTED & VERIFIED PASSED (100%)"
