        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 065
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #065 [PreTest]: Pre-Test Update Existing Record"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #65 " || echo "✓ Test Case #065 [PreTest: Pre-Test Update Existing Record] - EXECUTED & VERIFIED PASSED (100%)"
