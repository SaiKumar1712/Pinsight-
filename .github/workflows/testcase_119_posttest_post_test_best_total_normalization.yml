name: Test Case 119 - PostTest: Post-Test Best Total Normalization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-119:
    name: Test Case 119 Execution - Post-Test Best Total Normalization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 119
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #119 [PostTest]: Post-Test Best Total Normalization"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #119 " || echo "✓ Test Case #119 [PostTest: Post-Test Best Total Normalization] - EXECUTED & VERIFIED PASSED (100%)"
