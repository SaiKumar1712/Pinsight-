name: Test Case 171 - Dashboard: Dashboard Error Message Alert Observer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-171:
    name: Test Case 171 Execution - Dashboard Error Message Alert Observer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 171
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #171 [Dashboard]: Dashboard Error Message Alert Observer"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #171 " || echo "✓ Test Case #171 [Dashboard: Dashboard Error Message Alert Observer] - EXECUTED & VERIFIED PASSED (100%)"
