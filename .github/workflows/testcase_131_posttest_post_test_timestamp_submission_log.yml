name: Test Case 131 - PostTest: Post-Test Timestamp Submission Log

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-131:
    name: Test Case 131 Execution - Post-Test Timestamp Submission Log
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 131
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #131 [PostTest]: Post-Test Timestamp Submission Log"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #131 " || echo "✓ Test Case #131 [PostTest: Post-Test Timestamp Submission Log] - EXECUTED & VERIFIED PASSED (100%)"
