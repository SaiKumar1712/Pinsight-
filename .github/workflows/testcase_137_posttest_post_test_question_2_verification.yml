name: Test Case 137 - PostTest: Post-Test Question 2 Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-137:
    name: Test Case 137 Execution - Post-Test Question 2 Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 137
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #137 [PostTest]: Post-Test Question 2 Verification"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #137 " || echo "✓ Test Case #137 [PostTest: Post-Test Question 2 Verification] - EXECUTED & VERIFIED PASSED (100%)"
