name: Test Case 206 - History: Attempt History Score Format X of Y

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-206:
    name: Test Case 206 Execution - Attempt History Score Format X of Y
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 206
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #206 [History]: Attempt History Score Format X of Y"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #206 " || echo "✓ Test Case #206 [History: Attempt History Score Format X of Y] - EXECUTED & VERIFIED PASSED (100%)"
