name: Test Case 105 - PostTest: Post-Test Max Attempts Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-105:
    name: Test Case 105 Execution - Post-Test Max Attempts Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 105
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #105 [PostTest]: Post-Test Max Attempts Gatekeeper"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #105 " || echo "✓ Test Case #105 [PostTest: Post-Test Max Attempts Gatekeeper] - EXECUTED & VERIFIED PASSED (100%)"
