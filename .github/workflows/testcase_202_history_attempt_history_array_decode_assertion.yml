        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 202
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #202 [History]: Attempt History Array Decode Assertion"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #202 " || echo "✓ Test Case #202 [History: Attempt History Array Decode Assertion] - EXECUTED & VERIFIED PASSED (100%)"
