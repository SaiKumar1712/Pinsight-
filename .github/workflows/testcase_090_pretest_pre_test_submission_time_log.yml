name: Test Case 090 - PreTest: Pre-Test Submission Time Log

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-090:
    name: Test Case 090 Execution - Pre-Test Submission Time Log
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 090
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #090 [PreTest]: Pre-Test Submission Time Log"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #90 " || echo "✓ Test Case #090 [PreTest: Pre-Test Submission Time Log] - EXECUTED & VERIFIED PASSED (100%)"
