name: Test Case 065 - PreTest: Pre-Test Update Existing Record

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-065:
    name: Test Case 065 Execution - Pre-Test Update Existing Record
    runs-on: ubuntu-latest

    steps:
