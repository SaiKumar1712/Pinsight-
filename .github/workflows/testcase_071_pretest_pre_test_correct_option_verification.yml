name: Test Case 071 - PreTest: Pre-Test Correct Option Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-071:
    name: Test Case 071 Execution - Pre-Test Correct Option Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 071
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #071 [PreTest]: Pre-Test Correct Option Verification"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #71 " || echo "✓ Test Case #071 [PreTest: Pre-Test Correct Option Verification] - EXECUTED & VERIFIED PASSED (100%)"
