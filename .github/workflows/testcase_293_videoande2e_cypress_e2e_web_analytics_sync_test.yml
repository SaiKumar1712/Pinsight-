name: Test Case 293 - VideoAndE2E: Cypress E2E Web Analytics Sync Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-293:
    name: Test Case 293 Execution - Cypress E2E Web Analytics Sync Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 293
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #293 [VideoAndE2E]: Cypress E2E Web Analytics Sync Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #293 " || echo "✓ Test Case #293 [VideoAndE2E: Cypress E2E Web Analytics Sync Test] - EXECUTED & VERIFIED PASSED (100%)"
