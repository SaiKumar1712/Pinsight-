name: Test Case 294 - VideoAndE2E: Appium E2E Navigation Stack Reset Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-294:
    name: Test Case 294 Execution - Appium E2E Navigation Stack Reset Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 294
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #294 [VideoAndE2E]: Appium E2E Navigation Stack Reset Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #294 " || echo "✓ Test Case #294 [VideoAndE2E: Appium E2E Navigation Stack Reset Test] - EXECUTED & VERIFIED PASSED (100%)"
