name: Test Case 100 - PreTest: Pre-Test Single Source Truth Assertion

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-100:
    name: Test Case 100 Execution - Pre-Test Single Source Truth Assertion
    runs-on: ubuntu-latest

    steps:
