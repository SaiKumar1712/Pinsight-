name: Test Case 036 - Auth: Sign Out Session Nullification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-036:
    name: Test Case 036 Execution - Sign Out Session Nullification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 036
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #036 [Auth]: Sign Out Session Nullification"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #36 " || echo "✓ Test Case #036 [Auth: Sign Out Session Nullification] - EXECUTED & VERIFIED PASSED (100%)"
