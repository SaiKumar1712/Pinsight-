name: Test Case 180 - Dashboard: Dashboard Sheet Profile View Dismiss

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-180:
    name: Test Case 180 Execution - Dashboard Sheet Profile View Dismiss
    runs-on: ubuntu-latest

    steps:
