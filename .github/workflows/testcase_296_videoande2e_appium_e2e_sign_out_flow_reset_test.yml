        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 296
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #296 [VideoAndE2E]: Appium E2E Sign Out Flow Reset Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #296 " || echo "✓ Test Case #296 [VideoAndE2E: Appium E2E Sign Out Flow Reset Test] - EXECUTED & VERIFIED PASSED (100%)"
