name: Test Case 288 - VideoAndE2E: Playwright Web E2E Cross Browser Safari

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-288:
    name: Test Case 288 Execution - Playwright Web E2E Cross Browser Safari
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 288
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #288 [VideoAndE2E]: Playwright Web E2E Cross Browser Safari"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #288 " || echo "✓ Test Case #288 [VideoAndE2E: Playwright Web E2E Cross Browser Safari] - EXECUTED & VERIFIED PASSED (100%)"
