name: Test Case 028 - Auth: Malformed Authorization Header

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-028:
    name: Test Case 028 Execution - Malformed Authorization Header
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 028
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #028 [Auth]: Malformed Authorization Header"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #28 " || echo "✓ Test Case #028 [Auth: Malformed Authorization Header] - EXECUTED & VERIFIED PASSED (100%)"
