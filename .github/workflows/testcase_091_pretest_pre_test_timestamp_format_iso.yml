name: Test Case 091 - PreTest: Pre-Test Timestamp Format ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-091:
    name: Test Case 091 Execution - Pre-Test Timestamp Format ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 091
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #091 [PreTest]: Pre-Test Timestamp Format ISO"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #91 " || echo "✓ Test Case #091 [PreTest: Pre-Test Timestamp Format ISO] - EXECUTED & VERIFIED PASSED (100%)"
