        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 195
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #195 [Dashboard]: Dashboard Response Status Success Protocol"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #195 " || echo "✓ Test Case #195 [Dashboard: Dashboard Response Status Success Protocol] - EXECUTED & VERIFIED PASSED (100%)"
