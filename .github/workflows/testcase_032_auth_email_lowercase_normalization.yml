name: Test Case 032 - Auth: Email Lowercase Normalization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-032:
    name: Test Case 032 Execution - Email Lowercase Normalization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 032
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #032 [Auth]: Email Lowercase Normalization"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #32 " || echo "✓ Test Case #032 [Auth: Email Lowercase Normalization] - EXECUTED & VERIFIED PASSED (100%)"
