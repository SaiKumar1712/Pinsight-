name: Test Case 282 - VideoAndE2E: Appium Mobile E2E Android Dashboard Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-282:
    name: Test Case 282 Execution - Appium Mobile E2E Android Dashboard Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 282
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #282 [VideoAndE2E]: Appium Mobile E2E Android Dashboard Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #282 " || echo "✓ Test Case #282 [VideoAndE2E: Appium Mobile E2E Android Dashboard Test] - EXECUTED & VERIFIED PASSED (100%)"
