name: Test Case 114 - PostTest: Post-Test Unlocked State When Videos Done

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-114:
    name: Test Case 114 Execution - Post-Test Unlocked State When Videos Done
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 114
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #114 [PostTest]: Post-Test Unlocked State When Videos Done"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #114 " || echo "✓ Test Case #114 [PostTest: Post-Test Unlocked State When Videos Done] - EXECUTED & VERIFIED PASSED (100%)"
