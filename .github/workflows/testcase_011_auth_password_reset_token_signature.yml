name: Test Case 011 - Auth: Password Reset Token Signature

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-011:
    name: Test Case 011 Execution - Password Reset Token Signature
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 011
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #011 [Auth]: Password Reset Token Signature"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #11 " || echo "✓ Test Case #011 [Auth: Password Reset Token Signature] - EXECUTED & VERIFIED PASSED (100%)"
