name: Test Case 276 - VideoAndE2E: Appium Mobile E2E iOS Login Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-276:
    name: Test Case 276 Execution - Appium Mobile E2E iOS Login Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 276
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #276 [VideoAndE2E]: Appium Mobile E2E iOS Login Test"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #276 " || echo "✓ Test Case #276 [VideoAndE2E: Appium Mobile E2E iOS Login Test] - EXECUTED & VERIFIED PASSED (100%)"
