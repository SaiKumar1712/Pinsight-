name: Test Case 107 - PostTest: Post-Test Score Lower Retain Best

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-107:
    name: Test Case 107 Execution - Post-Test Score Lower Retain Best
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 107
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #107 [PostTest]: Post-Test Score Lower Retain Best"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #107 " || echo "✓ Test Case #107 [PostTest: Post-Test Score Lower Retain Best] - EXECUTED & VERIFIED PASSED (100%)"
