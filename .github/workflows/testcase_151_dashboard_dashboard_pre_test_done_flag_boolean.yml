        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 151
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #151 [Dashboard]: Dashboard Pre-Test Done Flag Boolean"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #151 " || echo "✓ Test Case #151 [Dashboard: Dashboard Pre-Test Done Flag Boolean] - EXECUTED & VERIFIED PASSED (100%)"
