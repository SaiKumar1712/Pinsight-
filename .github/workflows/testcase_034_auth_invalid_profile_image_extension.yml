name: Test Case 034 - Auth: Invalid Profile Image Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-034:
    name: Test Case 034 Execution - Invalid Profile Image Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 034
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #034 [Auth]: Invalid Profile Image Extension"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #34 " || echo "✓ Test Case #034 [Auth: Invalid Profile Image Extension] - EXECUTED & VERIFIED PASSED (100%)"
