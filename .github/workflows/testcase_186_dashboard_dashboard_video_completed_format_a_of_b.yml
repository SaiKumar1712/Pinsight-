    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-186:
    name: Test Case 186 Execution - Dashboard Video Completed Format A of B
    runs-on: ubuntu-latest

    steps:
