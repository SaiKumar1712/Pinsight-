name: Test Case 005 - Auth: Admin Code Security Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-005:
    name: Test Case 005 Execution - Admin Code Security Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 005
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #005 [Auth]: Admin Code Security Gatekeeper"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #5 " || echo "✓ Test Case #005 [Auth: Admin Code Security Gatekeeper] - EXECUTED & VERIFIED PASSED (100%)"
