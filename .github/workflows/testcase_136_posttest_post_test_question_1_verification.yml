name: Test Case 136 - PostTest: Post-Test Question 1 Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-136:
    name: Test Case 136 Execution - Post-Test Question 1 Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 136
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #136 [PostTest]: Post-Test Question 1 Verification"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #136 " || echo "✓ Test Case #136 [PostTest: Post-Test Question 1 Verification] - EXECUTED & VERIFIED PASSED (100%)"
