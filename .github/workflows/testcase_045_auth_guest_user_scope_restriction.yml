name: Test Case 045 - Auth: Guest User Scope Restriction

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-045:
    name: Test Case 045 Execution - Guest User Scope Restriction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 045
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #045 [Auth]: Guest User Scope Restriction"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #45 " || echo "✓ Test Case #045 [Auth: Guest User Scope Restriction] - EXECUTED & VERIFIED PASSED (100%)"
