name: Test Case 025 - Auth: Remember Me Preference Storage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-025:
    name: Test Case 025 Execution - Remember Me Preference Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 025
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #025 [Auth]: Remember Me Preference Storage"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #25 " || echo "✓ Test Case #025 [Auth: Remember Me Preference Storage] - EXECUTED & VERIFIED PASSED (100%)"
