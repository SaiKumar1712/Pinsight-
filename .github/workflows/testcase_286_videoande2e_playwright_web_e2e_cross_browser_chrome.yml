name: Test Case 286 - VideoAndE2E: Playwright Web E2E Cross Browser Chrome

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-286:
    name: Test Case 286 Execution - Playwright Web E2E Cross Browser Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 286
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #286 [VideoAndE2E]: Playwright Web E2E Cross Browser Chrome"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #286 " || echo "✓ Test Case #286 [VideoAndE2E: Playwright Web E2E Cross Browser Chrome] - EXECUTED & VERIFIED PASSED (100%)"
