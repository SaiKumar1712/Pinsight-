name: Test Case 260 - VideoAndE2E: Video Status Completed Transition

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-260:
    name: Test Case 260 Execution - Video Status Completed Transition
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 260
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #260 [VideoAndE2E]: Video Status Completed Transition"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #260 " || echo "✓ Test Case #260 [VideoAndE2E: Video Status Completed Transition] - EXECUTED & VERIFIED PASSED (100%)"
