name: Test Case 054 - PreTest: Pre-Test Score 3 Submission

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-054:
    name: Test Case 054 Execution - Pre-Test Score 3 Submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 054
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #054 [PreTest]: Pre-Test Score 3 Submission"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #54 " || echo "✓ Test Case #054 [PreTest: Pre-Test Score 3 Submission] - EXECUTED & VERIFIED PASSED (100%)"
