name: Test Case 117 - PostTest: Post-Test Score 10 Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-117:
    name: Test Case 117 Execution - Post-Test Score 10 Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 117
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #117 [PostTest]: Post-Test Score 10 Evaluation"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #117 " || echo "✓ Test Case #117 [PostTest: Post-Test Score 10 Evaluation] - EXECUTED & VERIFIED PASSED (100%)"
