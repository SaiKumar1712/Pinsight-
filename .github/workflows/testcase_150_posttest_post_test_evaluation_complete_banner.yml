name: Test Case 150 - PostTest: Post-Test Evaluation Complete Banner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-150:
    name: Test Case 150 Execution - Post-Test Evaluation Complete Banner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 150
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #150 [PostTest]: Post-Test Evaluation Complete Banner"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #150 " || echo "✓ Test Case #150 [PostTest: Post-Test Evaluation Complete Banner] - EXECUTED & VERIFIED PASSED (100%)"
