name: Test Case 287 - VideoAndE2E: Playwright Web E2E Cross Browser Firefox

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-287:
    name: Test Case 287 Execution - Playwright Web E2E Cross Browser Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 287
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #287 [VideoAndE2E]: Playwright Web E2E Cross Browser Firefox"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #287 " || echo "✓ Test Case #287 [VideoAndE2E: Playwright Web E2E Cross Browser Firefox] - EXECUTED & VERIFIED PASSED (100%)"
