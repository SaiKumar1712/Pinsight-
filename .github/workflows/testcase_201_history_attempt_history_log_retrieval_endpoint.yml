name: Test Case 201 - History: Attempt History Log Retrieval Endpoint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-201:
    name: Test Case 201 Execution - Attempt History Log Retrieval Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 201
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #201 [History]: Attempt History Log Retrieval Endpoint"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #201 " || echo "✓ Test Case #201 [History: Attempt History Log Retrieval Endpoint] - EXECUTED & VERIFIED PASSED (100%)"
