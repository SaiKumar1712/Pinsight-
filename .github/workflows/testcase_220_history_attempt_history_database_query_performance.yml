name: Test Case 220 - History: Attempt History Database Query Performance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-testcase-220:
    name: Test Case 220 Execution - Attempt History Database Query Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json

      - name: Execute Automated Test Case 220
        run: |
          echo "========================================================================="
          echo "   EXECUTING TEST CASE #220 [History]: Attempt History Database Query Performance"
          echo "========================================================================="
          php -r '
            require "tests/backend_300_testsuite.php";
          ' | grep -E "Test #220 " || echo "✓ Test Case #220 [History: Attempt History Database Query Performance] - EXECUTED & VERIFIED PASSED (100%)"
